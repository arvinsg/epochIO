[workspace]
resolver = "3"
members = ["crates/*", "xtask"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false

[workspace.dependencies]
epoch-proto = { path = "crates/epoch-proto" }
epoch-telemetry = { path = "crates/epoch-telemetry" }
epoch-ec = { path = "crates/epoch-ec" }
epoch-rpc = { path = "crates/epoch-rpc" }
epoch-rocks = { path = "crates/epoch-rocks" }
epoch-store = { path = "crates/epoch-store" }
epoch-client = { path = "crates/epoch-client" }
epoch-pd = { path = "crates/epoch-pd" }
epoch-meta = { path = "crates/epoch-meta" }
epoch-gateway = { path = "crates/epoch-gateway" }
epoch-worker = { path = "crates/epoch-worker" }
epoch-node = { path = "crates/epoch-node" }

thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "json"] }
prometheus = "0.13"
toml = "0.8"
serde = { version = "1", features = ["derive"] }
reed-solomon-simd = "3.1"
blake3 = "1"
crc32c = "0.6"
md5 = { package = "md-5", version = "0.10" }
rocksdb = { version = "0.24", default-features = false, features = ["lz4", "bindgen-runtime"] }
tokio = { version = "1", default-features = false }
tokio-stream = "0.1"
bytes = "1"
async-trait = "0.1"
s3s = "0.14"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["server", "tokio"] }
http-body-util = "0.1"
http = "1"
aws-sigv4 = "1"
aws-credential-types = "1"
reqwest = { version = "0.12", default-features = false, features = ["http2"] }
# PD/Meta consensus: one raft group per service (openraft 0.9; Q25/Q22). The
# serde feature persists log entries / vote / snapshot through epoch-rocks;
# storage-v2 is required to implement the split RaftLogStorage / RaftStateMachine
# traits from a downstream crate (its `Sealed` blanket impl is gated on it).
openraft = { version = "0.9", features = ["serde", "storage-v2"] }
tonic = "0.14"
tonic-prost = "0.14"
prost = "0.14"
tonic-prost-build = "0.14"
libc = "0.2"
include_dir = "0.7"
getrandom = "0.2"
criterion = "0.5"
proptest = "1"
tempfile = "3"
serde_json = "1"

[workspace.lints.clippy]
uninlined_format_args = "allow"
