[package]
name = "epoch-meta"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
epoch-proto = { workspace = true, features = ["serde", "grpc"] }
epoch-rocks = { workspace = true }
openraft = { workspace = true }
rocksdb = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
blake3 = { workspace = true }
thiserror = { workspace = true }
# Multi-raft runtime: spawn (group tasks + batch flush tasks), mpsc/oneshot
# (envelope queues), time (batch window). The process runtime is the Tokio one
# that drives openraft's `TokioRuntime`.
tokio = { workspace = true, features = ["rt", "sync", "time"] }
tonic = { workspace = true }
tracing = { workspace = true }
async-trait = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tracing-subscriber = { workspace = true }
